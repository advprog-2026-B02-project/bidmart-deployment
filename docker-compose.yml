version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: bidmart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bidmart-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: bidmart-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bidmart-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-auth-service:latest
    container_name: bidmart-auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8081
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - DATABASE_USERNAME=${AUTH_DATABASE_USERNAME}
      - DATABASE_PASSWORD=${AUTH_DATABASE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-900000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - AUTH_MAX_CONCURRENT_SESSIONS=${AUTH_MAX_CONCURRENT_SESSIONS:-3}
      - AUTH_SESSION_LIMIT_POLICY=${AUTH_SESSION_LIMIT_POLICY:-REVOKE_OLDEST_SESSION}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - X_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://auth-service:8081
      - FRONTEND_URL=${APP_FRONTEND_URL:-http://frontend:3000}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://frontend:3000}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - APP_MAIL_ENABLED=${APP_MAIL_ENABLED:-true}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-${MAIL_USERNAME}}
    networks:
      - bidmart-network

  bidding-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-bidding-service:latest
    container_name: bidmart-bidding-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${BIDDING_DATABASE_URL}
      - DATABASE_USERNAME=${BIDDING_DATABASE_USERNAME}
      - DATABASE_PASSWORD=${BIDDING_DATABASE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://bidding-service:8082
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://frontend:3000}
      - USER_SERVICE_URL=http://auth-service:8081
      - CATALOG_SERVICE_URL=http://catalog-service:8083
      - WALLET_SERVICE_URL=http://wallet-service:8084
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - ORDER_SERVICE_URL=http://order-service:8085
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bidmart-network

  catalog-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-catalog-service:latest
    container_name: bidmart-catalog-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${CATALOG_DATABASE_URL}
      - DATABASE_USERNAME=${CATALOG_DATABASE_USERNAME}
      - DATABASE_PASSWORD=${CATALOG_DATABASE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://catalog-service:8083
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://frontend:3000}
      - USER_SERVICE_URL=http://auth-service:8081
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bidmart-network

  wallet-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-wallet-service:latest
    container_name: bidmart-wallet-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - DATABASE_URL=${WALLET_DATABASE_URL}
      - DATABASE_USERNAME=${WALLET_DATABASE_USERNAME}
      - DATABASE_PASSWORD=${WALLET_DATABASE_PASSWORD}
      - SPRING_DATASOURCE_URL=${WALLET_DATABASE_URL}
      - SPRING_DATASOURCE_USERNAME=${WALLET_DATABASE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${WALLET_DATABASE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://wallet-service:8084
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://frontend:3000}
      - USER_SERVICE_URL=http://auth-service:8081
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bidmart-network

  notification-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-notification-service:latest
    container_name: bidmart-notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - DATABASE_URL=${NOTIF_DATABASE_URL}
      - DATABASE_USERNAME=${NOTIF_DATABASE_USERNAME}
      - DATABASE_PASSWORD=${NOTIF_DATABASE_PASSWORD}
      - SPRING_DATASOURCE_URL=${NOTIF_DATABASE_URL}
      - SPRING_DATASOURCE_USERNAME=${NOTIF_DATABASE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NOTIF_DATABASE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://notification-service:8086
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://frontend:3000}
      - USER_SERVICE_URL=http://auth-service:8081
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bidmart-network

  order-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-order-service:latest
    container_name: bidmart-order-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=${ORDER_DATABASE_URL}
      - DATABASE_USERNAME=${ORDER_DATABASE_USERNAME}
      - DATABASE_PASSWORD=${ORDER_DATABASE_PASSWORD}
      - SPRING_DATASOURCE_URL=${ORDER_DATABASE_URL}
      - SPRING_DATASOURCE_USERNAME=${ORDER_DATABASE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${ORDER_DATABASE_PASSWORD}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://order-service:8085
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://frontend:3000}
      - USER_SERVICE_URL=http://auth-service:8081
      - CATALOG_SERVICE_URL=http://catalog-service:8083
      - WALLET_SERVICE_URL=http://wallet-service:8084
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bidmart-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/bidmart-frontend:latest
    container_name: bidmart-frontend
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - BIDDING_SERVICE_URL=http://bidding-service:8082
      - CATALOG_SERVICE_URL=http://catalog-service:8083
      - WALLET_SERVICE_URL=http://wallet-service:8084
      - ORDER_SERVICE_URL=http://order-service:8085
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
    depends_on:
      - auth-service
      - bidding-service
      - catalog-service
      - wallet-service
      - order-service
      - notification-service
    networks:
      - bidmart-network

  nginx:
    image: nginx:latest
    container_name: bidmart-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
    networks:
      - bidmart-network

  certbot:
    image: certbot/certbot
    container_name: bidmart-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

networks:
  bidmart-network:
    driver: bridge