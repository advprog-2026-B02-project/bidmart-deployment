version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: bidmart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bidmart-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: bidmart-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bidmart-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-auth-service:latest
    container_name: bidmart-auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://auth-service:8081
      - APP_FRONTEND_URL=http://frontend:3000
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
    networks:
      - bidmart-network

  bidding-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-bidding-service:latest
    container_name: bidmart-bidding-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://bidding-service:8082
      - APP_FRONTEND_URL=http://frontend:3000
      - USER_SERVICE_URL=http://auth-service:8081
      - CATALOG_SERVICE_URL=http://catalog-service:8083
      - WALLET_SERVICE_URL=http://wallet-service:8084
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - ORDER_SERVICE_URL=http://order-service:8085
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bidmart-network

  catalog-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-catalog-service:latest
    container_name: bidmart-catalog-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://catalog-service:8083
      - APP_FRONTEND_URL=http://frontend:3000
      - USER_SERVICE_URL=http://auth-service:8081
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bidmart-network

  wallet-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-wallet-service:latest
    container_name: bidmart-wallet-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://wallet-service:8084
      - APP_FRONTEND_URL=http://frontend:3000
      - USER_SERVICE_URL=http://auth-service:8081
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bidmart-network

  notification-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-notification-service:latest
    container_name: bidmart-notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://notification-service:8086
      - APP_FRONTEND_URL=http://frontend:3000
      - USER_SERVICE_URL=http://auth-service:8081
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bidmart-network

  order-service:
    image: ${DOCKERHUB_USERNAME}/bidmart-order-service:latest
    container_name: bidmart-order-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://order-service:8085
      - APP_FRONTEND_URL=http://frontend:3000
      - USER_SERVICE_URL=http://auth-service:8081
      - CATALOG_SERVICE_URL=http://catalog-service:8083
      - WALLET_SERVICE_URL=http://wallet-service:8084
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
    networks:
      - bidmart-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/bidmart-frontend:latest
    container_name: bidmart-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - BIDDING_SERVICE_URL=http://bidding-service:8082
      - CATALOG_SERVICE_URL=http://catalog-service:8083
      - WALLET_SERVICE_URL=http://wallet-service:8084
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - ORDER_SERVICE_URL=http://order-service:8085
    depends_on:
      - auth-service
      - bidding-service
      - catalog-service
      - wallet-service
      - notification-service
      - order-service
    networks:
      - bidmart-network

networks:
  bidmart-network:
    driver: bridge